# https://docs.codacy.com/repositories-configure/codacy-configuration-file/
---
exclude_paths:
  - "android/**"
  - "ios/**"
  - "web/**"
  - "windows/**"
  - "macos/**"
  - "linux/**"
  - "build/**"
  - "docs/**"
  - "lib/l10n/app_localizations*.dart"

# Codacy の dartanalyzer は Flutter SDK も `pub get` もない環境で動くため、
# setUp / WidgetTester / package:prime_fact/... などが未定義扱いになり誤検知が大量に出る。
# 同じ検査は CI の `flutter analyze`（very_good_analysis）が依存を解決した状態で行っている。
engines:
  dartanalyzer:
    enabled: false
x
