# https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        # 導入直後は参考表示にとどめ、小さな PR で赤くならないようにする
        informational: true

ignore:
  - lib/l10n/**
  - lib/**/*.g.dart
