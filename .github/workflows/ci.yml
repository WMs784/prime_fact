name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # 関数ごとの循環的複雑度（CCN）が 15 を超えたら落とす。l10n の生成物は除く
      - name: Check cyclomatic complexity
        run: |
          pip install lizard==1.26.0
          lizard lib -l dart -x "lib/l10n/app_localizations*" -C 15 -w

      - name: Test
        run: flutter test --coverage

      # リポジトリの Secrets に CODECOV_TOKEN が必要。fork からの PR など
      # トークンが無い場合でも CI を落とさない
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # 依存の向きの検査。上の層は下の層を使えるが、逆（下から上、共通部品から他のファイル）と
  # 循環依存は落とす。層のルールは tool/deps/build.py の LAYERS / SHARED
  check-dependencies:
    name: Check dependency direction
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # lakos を入れるために dart が要る（pub get は不要）
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Check dependency direction
        run: |
          dart pub global activate lakos 2.0.7
          export PATH="$PATH:$HOME/.pub-cache/bin"
          python3 tool/deps/build.py --check .

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

  build-web:
    name: Build Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # pages.yml と同じ条件でビルドして、マージ前に Web ビルドの失敗を検出する
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/app/"
