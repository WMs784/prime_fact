name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # docs/ (Jekyll) をサイトのルートとしてビルドする
      - name: Build docs (Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Flutter Web は /<repo>/app/ 配下に配置する
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/app/"

      # jekyll-build-pages は root で実行されるため、_site の所有者を戻してからコピーする
      - name: Add web app to site
        run: |
          sudo chown -R "$USER" _site
          cp -r build/web _site/app

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Pages へのデプロイ（OIDC で deploy-pages が認証する）に必要な権限は、このジョブにだけ付ける
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
