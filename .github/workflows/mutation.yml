name: Mutation Test

# 時間がかかる（約 20 分、judge.dart が大半）ので、PR ごとには回さない。
#   - master への push: マージ直後に、テストが弱くなったことに気づく（ゲートではなく事後検知）。
#     ロジックとテストに関係する変更だけを対象にする
#   - 毎週月曜 03:00 JST: Flutter や mutation_test のバージョン更新で壊れたことの検知
#   - 手動実行
on:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "test/**"
      - "mutation_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "0 18 * * 0" # 日曜 18:00 UTC = 月曜 03:00 JST
  workflow_dispatch:

# 連続でマージしたとき、古い実行を止めて最新だけ回す
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 生き残った変異が mutation_test/run.sh の基準値を超えると失敗する
      - name: Run mutation tests
        run: mutation_test/run.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-test-report
          path: mutation-test-report/
